<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompuTienda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="container">
        <h1>CompuTienda</h1>
        <p>Sistema transaccional de Compras</p>

        <section class="purchase-panel">
            <h2>Realizar Compra</h2>
            <select id="client">
                <option value="1">
                    Ana Torres
                </option>
                <option value="2">
                    Carlos Pérez
                </option>
            </select>            
            <label for="quantity">Cantidad</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1">

            <label>
                <input type="checkbox" id="failPayment">
                Simular fallo de pago
            </label>
            <label>
                <input type="checkbox" id="failInvoice">
                Simular fallo de facturación
            </label>
            <button id="buyButton">Comprar</button>
        </section>
        <section>
            <h2>Productos</h2>
            <div id="products">
                Cargando productos...
            </div>
        </section>
        <section>
            <h2>Resultado</h2>
            <pre id="result">Esperando una compra...</pre>
        </section>        
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>        
</body>
</html>
